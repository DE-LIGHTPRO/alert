name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build
        working-directory: contracts

      - name: Test
        run: forge test -vv
        working-directory: contracts

      # The suite passing is not the same as the suite being able to fail. This breaks
      # each guard in turn and asserts a named test catches it. It is what found the
      # unvalidated bank domain in open(), where every test stayed green.
      - name: Mutation check
        run: python3 -I script/mutate.py
        working-directory: contracts

      # The landing page said "30 tests" and the audit page "14 mutations" against a
      # suite that had grown to 50 and 19. Both were true when written, and neither looks
      # wrong on a later read. The audit page is where a judge goes specifically to check
      # whether the claims hold, so a stale figure there costs more than anywhere else.
      - name: Site claims match the tools
        run: python3 -I script/check-claims.py
        working-directory: contracts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Skips with a message when the fixtures are absent, which they always are in CI:
      # they are real bank alerts carrying a name, account number and balance, and are
      # gitignored. Run it locally to exercise them.
      - name: .eml reader
        run: node web/eml.test.mjs

      # viem is the only devDependency and exists so this job can run the PAGE'S OWN hash
      # function outside a browser. The page still loads viem from a CDN and has no build
      # step; nothing here is shipped.
      - name: Install dev tooling
        run: npm ci

      # The 248-bit truncation is performed independently by the circuit, AlertHash.sol
      # and web/hash.js, and a disagreement raises no error anywhere: the escrow stores a
      # hash the proof can never produce, and a correct payment is refused at settlement.
      #
      # contracts/test/CrossLanguageHash.t.sol asserts vectors generated from web/hash.js,
      # so a change on the Solidity side fails there. This step closes the other
      # direction: regenerate from the page and fail if the committed fixture moved, so
      # JavaScript cannot drift without the Solidity test seeing new numbers.
      - name: Cross-language hash vectors are current
        run: |
          set -e
          # `git diff` reports nothing for an untracked file, so without this the whole
          # step would pass vacuously if the fixture were ever removed from the index.
          git ls-files --error-unmatch fixtures/field-hash-vectors.json >/dev/null
          node scripts/gen-field-hash-vectors.mjs
          git diff --exit-code -- fixtures/field-hash-vectors.json \
            || { echo "::error::web/hash.js no longer produces the committed vectors. Commit the regenerated fixture and make sure contracts/test/CrossLanguageHash.t.sol still passes."; exit 1; }

      # No bundler, so the only way a syntax error reaches production is if nothing ever
      # parses these files. `node --check` parses ESM, including the CDN imports it
      # cannot resolve, which is exactly what we want: syntax without execution.
      #
      # The first version of this stripped import/export lines with a regex and fed the
      # rest to `new Function`. It deleted `export function foo() {` outright and then
      # reported the orphaned body as a syntax error, failing on a file whose own test
      # suite imports it successfully. The check has to be sound before its result means
      # anything.
      # app.html carried <span id="net-chip">Base Sepolia</span> that no script ever
      # wrote to, and receipt.html asserted a DKIM attestation the same way. An id is a
      # promise that something addresses the element; a hardcoded value under an unwired
      # id is indistinguishable from a live one until you change the input.
      - name: No element carries an id nothing addresses
        run: node scripts/check-dead-ids.mjs

      # A receipt means mined, not succeeded. Driving the refund path before its
      # deadline, the escrow refused, the transaction was mined reverted, and the page
      # said "Reclaimed." while the USDC never moved. The same bug on the settle path
      # tells a buyer their money was released when nothing happened.
      - name: Every transaction receipt has its status checked
        run: node scripts/check-receipt-status.mjs

      # The light palette lived only inside @media (prefers-color-scheme: light), so
      # data-theme="light" on a device whose OS is in dark mode matched nothing: the
      # toggle flipped the attribute, persisted the preference, and changed no colour.
      # It is declared twice now, and two copies of one palette drift.
      - name: Both light palettes agree
        run: node scripts/check-theme-parity.mjs

      - name: Parse the browser modules
        run: |
          set -e
          T=$(mktemp -d)
          for f in eml.js app.js ui.js prover.js hash.js; do
            cp "web/$f" "$T/${f%.js}.mjs"
            node --check "$T/${f%.js}.mjs"
            echo "parsed web/$f"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A real bank alert must never reach this repository. The .gitignore covers it;
      # this fails the build if anyone ever force-adds one, or pastes an account number
      # or balance into a doc. Both have already happened once in this project.
      - name: No bank alerts or personal data committed
        run: bash scripts/check-no-personal-data.sh
